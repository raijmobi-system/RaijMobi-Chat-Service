services:
  zookeeper-chat:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    container_name: zookeeper-chat
    networks:
      - raijmobi-network

  kafka-chat:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper-chat
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-chat:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chat:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    container_name: kafka-chat
    networks:
      - raijmobi-network

  # ========== PostgreSQL ==========
  postgres-chat:
    image: postgres:15
    container_name: postgres-chat
    environment:
      POSTGRES_DB: ${DB_NAME:-raijmobi_chat_db}
      POSTGRES_USER: ${DB_USER:-raijmobi_chat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raijmobi_pass}
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raijmobi_chat} -d ${DB_NAME:-raijmobi_chat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raijmobi-network

  # ========== Serviço principal ==========
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        python manage.py makemigrations chat_service --noinput &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python chat_service/consumer.py &
        python chat_service/ride_consumer.py &
        uvicorn core.asgi:application --host 0.0.0.0 --port 8000
      "
    ports:
      - "8002:8000"
    depends_on:
      kafka-chat:
        condition: service_started
      postgres-chat:
        condition: service_healthy
    environment:
      - DB_NAME=raijmobi_chat_db
      - DB_USER=raijmobi_chat
      - DB_PASSWORD=raijmobi_pass
      - DB_HOST=postgres-chat
      - DB_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka-user:9092      # user-events + chat_notifications
      - KAFKA_BOOTSTRAP_SERVERS_RIDE=kafka-ride:9092  # ride-events (consumer de caronas)

    container_name: chat-service
    networks:
      - raijmobi-network

  # ========== Backup (corrigido) ==========
  db-backup:
    build:
      context: ../RaijMobi-Services-postgres-backups/chat-service   # <- caminho para os scripts
      dockerfile: Dockerfile
    container_name: postgres-chat-db
    environment:
      - DB_HOST=postgres-chat
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-raijmobi_chat_db}
      - DB_USER=${DB_USER:-raijmobi_chat}
      - DB_PASSWORD=${DB_PASSWORD:-raijmobi_pass}
      - BACKUP_DIR=/backups
      - BACKUP_INTERVAL_SECONDS=86400
      - TZ=America/Sao_Paulo
    volumes:
      - backup_chat_data:/backups
    networks:
      - raijmobi-network
    depends_on:
      - postgres-chat

  db-maintenance:
    build:
      context: ./maintenance
      dockerfile: Dockerfile
    container_name: postgres-chat-maintenance
    depends_on:
      postgres-chat:
        condition: service_healthy
    environment:
      - DB_HOST=postgres-chat
      - DB_PORT=5432
      - DB_NAME=raijmobi_chat_db
      - DB_USER=raijmobi_chat
      - DB_PASSWORD=raijmobi_pass
      - MAINTENANCE_INTERVAL_SECONDS=86400   # 24h; mude para 604800 (7 dias) se quiser
      - TZ=America/Sao_Paulo
      # - LOG_DIR=/app/logs                   # descomente se futuramente mapear volume de logs
      # - LOG_RETENTION_DAYS=30
    networks:
      - raijmobi-network


# ========== Volumes ==========
volumes:
  postgres_chat_data:
  backup_chat_data:

networks:
  raijmobi-network:
    external: true