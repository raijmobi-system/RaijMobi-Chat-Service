services:
  zookeeper-chat:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    container_name: zookeeper-chat
    networks:
      - raijmobi-network

  kafka-chat:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper-chat
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-chat:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chat:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    container_name: kafka-chat
    networks:
      - raijmobi-network

  # ========== PostgreSQL ==========
  postgres-chat:
    image: postgres:15
    container_name: postgres-chat
    environment:
      POSTGRES_DB: ${DB_NAME:-raijmobi_chat_db}
      POSTGRES_USER: ${DB_USER:-raijmobi_chat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raijmobi_pass}
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raijmobi_chat} -d ${DB_NAME:-raijmobi_chat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raijmobi-network

  # ========== Serviço principal ==========
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        python manage.py makemigrations chat_service --noinput &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        uvicorn core.asgi:application --host 0.0.0.0 --port 8000
      "
    ports:
      - "8002:8000"
    depends_on:
      kafka-chat:
        condition: service_started
      postgres-chat:
        condition: service_healthy
    environment:
      - DB_NAME=raijmobi_chat_db
      - DB_USER=raijmobi_chat
      - DB_PASSWORD=raijmobi_pass
      - DB_HOST=postgres-chat
      - DB_PORT=5432
      # CORRIGIDO: Apontando para o Kafka local ('kafka-chat') para os testes isolados funcionarem
      - KAFKA_BOOTSTRAP_SERVERS=kafka-chat:9092
      - KAFKA_BOOTSTRAP_SERVERS_RIDE=kafka-chat:9092
      - NOTIFICATION_API_TOKEN=ch4t-s3rv1ce-sup3r-s3cr3t
    container_name: chat-service
    networks:
      - raijmobi-network

  
  consumer-user:
    build:
      context: .
      dockerfile: Dockerfile
    command: python chat_service/consumer.py
    depends_on:
      - kafka-chat
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-ride:9092
    container_name: chat-consumer-user
    networks:
      - raijmobi-network

  
  consumer-ride:
    build:
      context: .
      dockerfile: Dockerfile
    command: python chat_service/ride_consumer.py
    depends_on:
      - kafka-chat
    environment:
      - KAFKA_BOOTSTRAP_SERVERS_RIDE=kafka-ride:9092
    container_name: chat-consumer-ride
    networks:
      - raijmobi-network

