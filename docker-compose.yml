services:
  zookeeper-chat:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    container_name: zookeeper-chat
    networks:
      - raijmobi-network

  kafka-chat:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper-chat
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-chat:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chat:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    container_name: kafka-chat
    networks:
      - raijmobi-network

  # ========== PostgreSQL ==========
  postgres-chat:
    image: postgres:15
    container_name: postgres-chat
    environment:
      POSTGRES_DB: ${DB_NAME:-raijmobi_chat_db}
      POSTGRES_USER: ${DB_USER:-raijmobi_chat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raijmobi_pass}
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raijmobi_chat} -d ${DB_NAME:-raijmobi_chat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raijmobi-network

  redis-chat:
    image: redis:7-alpine
    container_name: redis-chat
    ports:
      - "6380:6379" # Porta exposta caso queira debugar de fora
    networks:
      - raijmobi-network

  # ========== Serviço principal (API & WebSockets) ==========
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        python manage.py makemigrations chat_service --noinput &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    ports:
      - "8002:8000"
    depends_on:
      kafka-chat:
        condition: service_started
      postgres-chat:
        condition: service_healthy
      redis-chat:               # 🌟 ADICIONE ESTA LINHA AQUI
        condition: service_started
    environment:
      - DB_NAME=raijmobi_chat_db
      - DB_USER=raijmobi_chat
      - DB_PASSWORD=raijmobi_pass
      - DB_HOST=postgres-chat
      - DB_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka-ride:9092
      - KAFKA_BOOTSTRAP_SERVERS_RIDE=kafka-ride:9092
      - REDIS_URL=redis://redis-chat:6379/0  # 🌟 ADICIONE ESTA LINHA AQUI
      - NOTIFICATION_API_TOKEN=ch4t-s3rv1ce-sup3r-s3cr3t
    container_name: chat-service
    networks:
      - raijmobi-network
  # ========== Consumidor de Usuários ==========
  consumer-user:
    build:
      context: .
      dockerfile: Dockerfile
    command: python chat_service/consumer.py
    depends_on:
      postgres-chat:
        condition: service_healthy
    environment:
      - DB_NAME=raijmobi_chat_db
      - DB_USER=raijmobi_chat
      - DB_PASSWORD=raijmobi_pass
      - DB_HOST=postgres-chat
      - DB_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka-ride:9092
    container_name: chat-consumer-user
    networks:
      - raijmobi-network

  # ========== Consumidor de Caronas (Criação de Salas) ==========
  consumer-ride:
    build:
      context: .
      dockerfile: Dockerfile
    command: python chat_service/ride_consumer.py
    depends_on:
      postgres-chat:
        condition: service_healthy
    environment:
      - DB_NAME=raijmobi_chat_db
      - DB_USER=raijmobi_chat
      - DB_PASSWORD=raijmobi_pass
      - DB_HOST=postgres-chat
      - DB_PORT=5432
      # CORRIGIDO: Escutando o broker correto onde as caronas são publicadas
      - KAFKA_BOOTSTRAP_SERVERS_RIDE=kafka-ride:9092
    container_name: chat-consumer-ride
    networks:
      - raijmobi-network

# ========== Volumes ==========
volumes:
  postgres_chat_data:
  backup_chat_data:

networks:
  raijmobi-network:
    external: true